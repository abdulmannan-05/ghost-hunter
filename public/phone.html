<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ghost Hunter — Controller</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070c; --panel:#12121c; --line:#2a2a3d;
    --ghost:#63c8ff; --red:#ff2530; --ok:#4ade80; --ink:#9aa0b4;
    --gold:#ffd166; --mango:#ffb347;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none}
  html,body{height:100%; overflow:hidden}
  body{
    margin:0; background:var(--bg); color:#eaf4ff;
    font-family:'Outfit','Helvetica Neue',Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:0; text-align:center; touch-action:none;
  }

  /* ---------- PORTRAIT SCREENS: NAME ENTRY + GAME OVER ---------- */
  .portrait-view{
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px; width:100%; height:100%;
  }
  h1{font-size:22px; font-weight:800; margin:0 0 4px;
    background:linear-gradient(135deg,#63c8ff,#a78bfa); -webkit-background-clip:text; -webkit-text-fill-color:transparent}
  .sub{color:var(--ink); font-size:13px; margin-bottom:22px}

  #status-line{
    display:inline-flex; align-items:center; gap:8px; font-size:11px;
    letter-spacing:1.5px; text-transform:uppercase; color:var(--ink);
    margin-bottom:22px; padding:6px 16px; border:1px solid var(--line); border-radius:999px;
  }
  #status-dot{width:9px; height:9px; border-radius:50%; background:var(--red); box-shadow:0 0 8px var(--red);
    transition:background 200ms, box-shadow 200ms}
  #status-dot.ok{background:var(--ok); box-shadow:0 0 8px var(--ok)}
  #status-dot.pending{background:#f5c542; box-shadow:0 0 8px #f5c542}

  button{
    font-size:17px; font-weight:700; letter-spacing:.5px; color:#0c0c14;
    background:var(--ghost); border:none; border-radius:12px;
    padding:18px 28px; width:100%; max-width:320px; margin-bottom:14px;
    box-shadow:0 6px 0 #3f86d6; transition:transform .05s;
    font-family:'Outfit','Helvetica Neue',Arial,sans-serif;
  }
  button:active{transform:translateY(4px); box-shadow:0 2px 0 #3f86d6}
  button.secondary{background:#1c1c2a; color:#eaf4ff; box-shadow:0 6px 0 #05050a}
  button.secondary:active{box-shadow:0 2px 0 #05050a}
  button:disabled{opacity:.4}
  .hidden{display:none !important}

  /* NAME & COMPANY INPUTS */
  #name-input, #company-input {
    font-size:16px; font-weight:700; text-align:center; letter-spacing:1px;
    background:var(--panel); color:#eaf4ff; border:2px solid var(--line);
    border-radius:12px; padding:14px 18px; width:100%; max-width:300px;
    margin-bottom:12px; outline:none; transition:border-color 200ms;
    font-family:'Outfit','Helvetica Neue',Arial,sans-serif;
  }
  #name-input:focus, #company-input:focus { border-color:var(--ghost) }
  #name-input::placeholder, #company-input::placeholder { color:var(--ink); opacity:.6; font-weight:500 }

  /* MANGO BADGE */
  #mango-badge{
    display:none; background:linear-gradient(135deg,#ffb347,#ff6f00);
    color:#1a0e00; font-weight:800; font-size:14px; letter-spacing:1px;
    padding:8px 16px; border-radius:999px; margin-bottom:14px;
    animation:mangoPulse 1s ease-in-out infinite;
  }
  @keyframes mangoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  /* ---------- LANDSCAPE GAME VIEW ---------- */
  #step-play{
    display:none;
    width:100vw; height:100vh; /* full screen */
    flex-direction:column; /* mini-hud on top, control row below */
    align-items:stretch;
    padding:0; margin:0;
    position:fixed; inset:0;
    background:var(--bg);
    z-index:100;
  }
  #step-play.active{display:flex !important}

  /* Mini HUD bar spans the full width at the top */
  #mini-hud{
    display:flex; gap:14px; justify-content:center; align-items:center;
    font-size:12px; color:var(--ink); letter-spacing:1px;
    background:rgba(18,18,28,0.9); border-bottom:1px solid var(--line);
    padding:6px 12px; flex-shrink:0;
  }

  /* Control row: exact 50/50 split — joystick left, fire+controls right */
  #play-body{
    flex:1; display:flex; flex-direction:row; min-height:0;
  }

  /* LEFT HALF: Joystick zone */
  #joystick-column{
    flex:1 1 50%;
    position:relative;
    background:radial-gradient(ellipse at center, rgba(99,200,255,0.05) 0%, transparent 70%);
    border-right:1px solid var(--line);
    overflow:hidden;
  }
  #joystick-zone{
    position:absolute; inset:0;
    touch-action:none;
    display:flex; align-items:center; justify-content:center;
    transition:opacity 0.2s;
  }
  #joystick-hint{
    font-size:13px; font-weight:700; color:rgba(154,160,180,0.55);
    letter-spacing:2px; text-transform:uppercase; line-height:1.7;
    pointer-events:none; text-align:center;
  }
  /* Floating joystick base — appears wherever the thumb touches down */
  #joystick-base{
    position:absolute;
    width:200px; height:200px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(99,200,255,0.10) 0%, rgba(99,200,255,0.03) 65%, transparent 100%);
    border:2px solid rgba(99,200,255,0.4);
    box-shadow:0 0 34px rgba(99,200,255,0.18), inset 0 0 24px rgba(99,200,255,0.1);
    display:none;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  #joystick-knob{
    position:absolute;
    width:84px; height:84px;
    left:50%; top:50%; margin-left:-42px; margin-top:-42px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(170,225,255,0.95), rgba(99,200,255,0.65) 55%, rgba(50,120,180,0.5) 100%);
    border:2px solid rgba(255,255,255,0.55);
    box-shadow:0 0 22px rgba(99,200,255,0.7), 0 4px 10px rgba(0,0,0,0.45);
  }

  /* RIGHT HALF: secondary controls on top, FIRE pinned to the bottom */
  #controls-column{
    flex:1 1 50%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:space-between;
    gap:10px;
    padding:14px 12px 20px;
    background:rgba(18,18,28,0.6);
  }
  #controls-top{
    width:100%; max-width:220px;
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }

  #fire-btn{
    width:min(34vw,144px); height:min(34vw,144px); border-radius:50%; background:var(--red);
    box-shadow:0 7px 0 #a3131c; font-size:20px; letter-spacing:1px; margin:0; padding:0;
    flex-shrink:0;
  }
  #fire-btn:active{transform:translateY(5px); box-shadow:0 2px 0 #a3131c}

  .ctrl-btn{
    width:100%; padding:12px 4px; font-size:12px; font-weight:700;
    border-radius:10px; margin:0; max-width:none; min-height:44px;
    box-shadow:0 3px 0 #05050a;
  }

  /* Sensitivity row */
  #sens-row{
    width:100%; padding:6px 8px;
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
  }
  #sens-row label{font-size:10px; color:var(--ink); display:block; margin-bottom:2px}
  #sens-slider{width:100%; margin:0}
  #sens-val{font-size:10px; color:var(--ghost); font-weight:bold}

  /* Aim readout */
  #tilt-readout{
    font-family:monospace; font-size:10px; color:var(--ink);
    text-align:center; width:100%;
  }
</style>
</head>
<body>
  <h1>👻 GHOST HUNTER</h1>
  <div class="sub">Event Controller</div>

  <div id="status-line"><span id="status-dot"></span><span id="status-text">Connecting…</span></div>

  <!-- STEP: NAME ENTRY (portrait) -->
  <div id="step-name" class="portrait-view">
    <div style="margin-bottom:12px; padding:10px 14px; background:rgba(255,193,7,0.18); border:1px solid rgba(255,193,7,0.4); border-radius:10px; color:#ffd166; font-size:12px; font-weight:700; text-align:center; letter-spacing:0.5px;">
      📱 Please rotate your phone to landscape mode 🔄
    </div>
    <p style="color:var(--ink); font-size:13px; max-width:300px; margin-bottom:14px;">Enter your details to join the hunt:</p>
    <input type="text" id="name-input" placeholder="Person Name" autocomplete="off" spellcheck="false">
    <input type="text" id="company-input" placeholder="Company Name" autocomplete="off" spellcheck="false">
    <button id="name-btn">START HUNTING 🎯</button>
  </div>

  <!-- STEP: PLAY (landscape joystick controller) -->
  <div id="step-play">
    <div id="mini-hud">
      <div id="mango-badge">🥭 TARGET REACHED!</div>
      <span>❤️ <b id="mini-health" style="color:#4ade80">100</b></span>
      <span>🔫 <b id="mini-ammo" style="color:var(--ghost)">5</b></span>
      <span>👻 <b id="mini-score" style="color:var(--gold)">0</b></span>
    </div>
    <div id="play-body">
      <!-- Left half: floating joystick -->
      <div id="joystick-column">
        <div id="joystick-zone">
          <div id="joystick-hint">🕹️<br>TOUCH & DRAG<br>TO AIM</div>
          <div id="joystick-base"><div id="joystick-knob"></div></div>
        </div>
      </div>

      <!-- Right half: secondary controls on top, FIRE pinned to bottom -->
      <div id="controls-column">
        <div id="controls-top">
          <button id="pause-btn" class="ctrl-btn secondary">⏸️ Pause</button>
          <button id="pc-toggle-btn" class="ctrl-btn secondary" style="background:#1a1a2e; border:1px solid #3a3a5c;">🖥️ Hunt by PC</button>
          <div id="sens-row">
            <label>Sensitivity <span id="sens-val">1.5x</span></label>
            <input type="range" id="sens-slider" min="0.5" max="4.0" step="0.1" value="1.5">
          </div>
          <div id="tilt-readout">aim: 0.00, 0.00</div>
        </div>
        <button id="fire-btn">FIRE</button>
      </div>
    </div>
  </div>

  <!-- STEP: GAME OVER (portrait) -->
  <div id="step-gameover" class="portrait-view hidden">
    <div id="gameover-title" style="font-size:20px; font-weight:800; color:var(--red); letter-spacing:2px; margin-bottom:6px;">YOU DIDN'T SURVIVE</div>
    <div style="font-size:13px; color:var(--ink); margin-bottom:6px;">Final Score</div>
    <div id="final-score" style="font-size:54px; font-weight:800; color:var(--ghost); margin-bottom:24px;">0</div>
    <button id="play-again-btn">PLAY AGAIN 🔄</button>
  </div>

<script>
  // ===================================================================
  // DOM REFS
  // ===================================================================
  const statusDot = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");
  const stepName = document.getElementById("step-name");
  const nameInput = document.getElementById("name-input");
  const companyInput = document.getElementById("company-input");
  const nameBtn = document.getElementById("name-btn");
  const stepPlay = document.getElementById("step-play");
  const stepGameover = document.getElementById("step-gameover");
  const fireBtn = document.getElementById("fire-btn");
  const playAgainBtn = document.getElementById("play-again-btn");
  const tiltReadout = document.getElementById("tilt-readout");
  const sensSlider = document.getElementById("sens-slider");
  const sensVal = document.getElementById("sens-val");
  const finalScoreEl = document.getElementById("final-score");
  const miniHealthEl = document.getElementById("mini-health");
  const miniAmmoEl = document.getElementById("mini-ammo");
  const miniScoreEl = document.getElementById("mini-score");
  const mangoBadge = document.getElementById("mango-badge");
  const gameoverTitle = document.getElementById("gameover-title");
  const joystickZone = document.getElementById("joystick-zone");
  const joystickBase = document.getElementById("joystick-base");
  const joystickKnob = document.getElementById("joystick-knob");
  const joystickHint = document.getElementById("joystick-hint");

  const pcToggleBtn = document.getElementById("pc-toggle-btn");

  // Phone audio & haptics
  const shootSound = new Audio("assets/audio/shoot.wav");
  shootSound.preload = "auto";
  shootSound.volume = 0.6;

  let userSensitivity = 1.5;
  let playerName = "Hunter";
  let companyName = "";
  let useMouseMode = false;

  sensSlider.addEventListener("input", (e) => {
    userSensitivity = parseFloat(e.target.value);
    sensVal.textContent = userSensitivity.toFixed(1) + "x";
  });

  function setStatus(state, text) {
    statusDot.className = state;
    statusText.textContent = text;
  }

  // ===================================================================
  // CONNECTION + PAIRING (WebSocket with HTTP Polling Fallback)
  // ===================================================================
  let useHttpFallback = false;
  let httpPollTimer = null;
  let activeRoomCode = (new URLSearchParams(location.search).get("room") || "").toUpperCase();

  function handleServerMessage(msg) {
    if (msg.type === "join-failed") {
      setStatus("", msg.reason || "Could not join room.");
    }
    if (msg.type === "joined") {
      setStatus("pending", `Joined room ${msg.room} — waiting for laptop…`);
    }
    if (msg.type === "paired") {
      setStatus("ok", "Paired with laptop ✅");
    }
    if (msg.type === "peer-disconnected" && msg.who === "laptop") {
      setStatus("pending", "Laptop disconnected.");
    }
    if (msg.type === "game-over") {
      finalScoreEl.textContent = msg.score;
      gameoverTitle.textContent = msg.win ? "🥭 TARGET REACHED!" : "YOU DIDN'T SURVIVE";
      gameoverTitle.style.color = msg.win ? "var(--mango)" : "var(--red)";
      stepPlay.classList.remove("active");
      stepGameover.classList.remove("hidden");
      if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
    }
    if (msg.type === "mango-reached") {
      mangoBadge.style.display = "block";
      if (navigator.vibrate) navigator.vibrate([80, 40, 80, 40, 150]);
    }
    if (msg.type === "state") {
      if (typeof msg.health === "number") {
        miniHealthEl.textContent = msg.health;
        miniHealthEl.style.color = msg.health <= 30 ? "var(--red)" : (msg.health <= 60 ? "#f5c542" : "#4ade80");
      }
      if (typeof msg.ammo === "number") {
        miniAmmoEl.textContent = msg.reloading ? "⏳" : msg.ammo;
        miniAmmoEl.style.color = msg.reloading ? "var(--red)" : "var(--ghost)";
      }
      if (typeof msg.score === "number") {
        miniScoreEl.textContent = msg.score;
      }
    }
  }

  function send(msg) {
    if (!useHttpFallback && ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify(msg));
    } else if (activeRoomCode) {
      fetch("/api/room/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ room: activeRoomCode, role: "phone", msg })
      }).catch(() => {});
    }
  }

  function startHttpFallback() {
    if (useHttpFallback) return;
    useHttpFallback = true;
    if (!activeRoomCode) {
      setStatus("", "No room code in link. Scan the QR again.");
      return;
    }
    setStatus("pending", "Joining room " + activeRoomCode + " via HTTP…");

    fetch("/api/room/join", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ room: activeRoomCode })
    })
      .then(r => r.json())
      .then(data => {
        if (data.ok) {
          handleServerMessage({ type: "joined", room: activeRoomCode });
          handleServerMessage({ type: "paired" });
          if (httpPollTimer) clearInterval(httpPollTimer);
          httpPollTimer = setInterval(() => {
            fetch(`/api/room/poll?room=${activeRoomCode}&role=phone`)
              .then(r => r.json())
              .then(p => {
                if (p.ok && p.msgs && p.msgs.length > 0) {
                  p.msgs.forEach(handleServerMessage);
                }
              })
              .catch(() => {});
          }, 80);
        } else {
          setStatus("", data.reason || "Could not join room.");
        }
      })
      .catch(() => {
        setStatus("", "Disconnected. Refresh to retry.");
      });
  }

  const wsProtocol = location.protocol === "https:" ? "wss" : "ws";
  let ws = null;

  if (activeRoomCode) {
    try {
      ws = new WebSocket(`${wsProtocol}://${location.host}`);
      ws.addEventListener("open", () => {
        setStatus("pending", "Joining room " + activeRoomCode + "…");
        ws.send(JSON.stringify({ type: "register-phone", room: activeRoomCode }));
      });
      ws.addEventListener("message", (e) => {
        try { handleServerMessage(JSON.parse(e.data)); } catch (err) {}
      });
      ws.addEventListener("close", () => {
        startHttpFallback();
      });
      ws.addEventListener("error", () => {
        startHttpFallback();
      });
    } catch (err) {
      startHttpFallback();
    }
  } else {
    setStatus("", "No room code in link. Scan the QR again.");
  }

  // ===================================================================
  // STEP: NAME & COMPANY ENTRY
  // ===================================================================
  const nameErrorEl = document.createElement("div");
  nameErrorEl.style.cssText = "color:var(--red); font-size:12px; margin-bottom:10px; display:none;";
  stepName.insertBefore(nameErrorEl, nameInput);

  nameBtn.addEventListener("click", () => {
    const valName = (nameInput.value || "").trim();
    const valCompany = (companyInput.value || "").trim();

    if (!valName || !valCompany) {
      if (!valName) nameInput.style.borderColor = "var(--red)";
      if (!valCompany) companyInput.style.borderColor = "var(--red)";
      nameErrorEl.textContent = "⚠️ Please enter both Person Name & Company Name!";
      nameErrorEl.style.display = "block";
      if (!valName) nameInput.focus(); else companyInput.focus();
      return;
    }

    nameErrorEl.style.display = "none";
    nameInput.style.borderColor = "var(--line)";
    companyInput.style.borderColor = "var(--line)";

    playerName = valName;
    companyName = valCompany;

    send({ type: "set-name", name: playerName, company: companyName });

    // Skip permission & calibration — go straight to play
    stepName.classList.add("hidden");
    stepPlay.classList.add("active");
    send({ type: "start-game" });
  });

  const clearErr = () => {
    if ((nameInput.value || "").trim() && (companyInput.value || "").trim()) {
      nameErrorEl.style.display = "none";
      nameInput.style.borderColor = "var(--line)";
      companyInput.style.borderColor = "var(--line)";
    }
  };
  nameInput.addEventListener("input", clearErr);
  companyInput.addEventListener("input", clearErr);

  nameInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") companyInput.focus();
  });
  companyInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") nameBtn.click();
  });

  // ===================================================================
  // VIRTUAL JOYSTICK AIM CONTROL (floating joystick, multi-touch aware)
  // ===================================================================
  // Touch anywhere in the left half and a joystick appears right under
  // your thumb — no need to find a precise spot. Drag to aim; release
  // and it springs back to center (crosshair recenters too).

  let aimX = 0, aimY = 0;
  let joystickTouchId = null; // identifier of the finger driving the joystick
  let joystickBaseClientX = 0, joystickBaseClientY = 0;
  let lastAimSendTime = 0;
  const JOYSTICK_RADIUS = 100; // must match #joystick-base half-width in CSS

  function showJoystickAt(clientX, clientY) {
    const zoneRect = joystickZone.getBoundingClientRect();
    // Clamp so the base circle always fully fits inside the zone
    const localX = Math.max(JOYSTICK_RADIUS, Math.min(zoneRect.width - JOYSTICK_RADIUS, clientX - zoneRect.left));
    const localY = Math.max(JOYSTICK_RADIUS, Math.min(zoneRect.height - JOYSTICK_RADIUS, clientY - zoneRect.top));
    joystickBaseClientX = zoneRect.left + localX;
    joystickBaseClientY = zoneRect.top + localY;
    joystickBase.style.left = localX + "px";
    joystickBase.style.top = localY + "px";
    joystickKnob.style.transition = "none";
    joystickKnob.style.transform = "translate(0px, 0px)";
    joystickBase.style.display = "block";
    joystickHint.style.display = "none";
  }

  function updateJoystick(clientX, clientY) {
    const dx = clientX - joystickBaseClientX;
    const dy = clientY - joystickBaseClientY;
    const dist = Math.min(JOYSTICK_RADIUS, Math.hypot(dx, dy));
    const angle = Math.atan2(dy, dx);
    const knobX = Math.cos(angle) * dist;
    const knobY = Math.sin(angle) * dist;
    joystickKnob.style.transform = `translate(${knobX}px, ${knobY}px)`;

    aimX = Math.max(-1, Math.min(1, (knobX / JOYSTICK_RADIUS) * userSensitivity));
    aimY = Math.max(-1, Math.min(1, (knobY / JOYSTICK_RADIUS) * userSensitivity));
    sendAim();
  }

  function releaseJoystick() {
    joystickTouchId = null;
    aimX = 0; aimY = 0;
    sendAim(true); // force immediate send so the crosshair snaps back to center
    tiltReadout.textContent = "aim: 0.00, 0.00";
    joystickKnob.style.transition = "transform 150ms ease-out";
    joystickKnob.style.transform = "translate(0px, 0px)";
    setTimeout(() => {
      joystickBase.style.display = "none";
      joystickKnob.style.transition = "none";
      if (!useMouseMode) joystickHint.style.display = "block";
    }, 150);
  }

  function sendAim(force) {
    const now = performance.now();
    if (force || now - lastAimSendTime > 25) {
      lastAimSendTime = now;
      const sx = Math.round(aimX * 1000) / 1000;
      const sy = Math.round(aimY * 1000) / 1000;
      tiltReadout.textContent = `aim: ${sx.toFixed(2)}, ${sy.toFixed(2)}`;
      send({ type: "aim", x: sx, y: sy });
    }
  }

  // Find a specific touch by identifier in a TouchList
  function findTouch(touchList, id) {
    for (let i = 0; i < touchList.length; i++) {
      if (touchList[i].identifier === id) return touchList[i];
    }
    return null;
  }

  joystickZone.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (useMouseMode) return; // ignore phone touch aim in mouse mode
    // Only claim the first finger that lands in the joystick zone
    if (joystickTouchId === null) {
      const touch = e.changedTouches[0];
      joystickTouchId = touch.identifier;
      showJoystickAt(touch.clientX, touch.clientY);
      updateJoystick(touch.clientX, touch.clientY);
      if (navigator.vibrate) navigator.vibrate(10);
    }
  }, { passive: false });

  joystickZone.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (useMouseMode || joystickTouchId === null) return;
    const touch = findTouch(e.touches, joystickTouchId);
    if (!touch) return;
    updateJoystick(touch.clientX, touch.clientY);
  }, { passive: false });

  joystickZone.addEventListener("touchend", (e) => {
    e.preventDefault();
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joystickTouchId) {
        releaseJoystick();
        break;
      }
    }
  }, { passive: false });

  joystickZone.addEventListener("touchcancel", (e) => {
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === joystickTouchId) {
        releaseJoystick();
        break;
      }
    }
  });

  // ===================================================================
  // PC / PHONE CONTROL MODE TOGGLE
  // ===================================================================
  let lastToggleTime = 0;
  function toggleControlMode() {
    const now = performance.now();
    if (now - lastToggleTime < 300) return;
    lastToggleTime = now;

    useMouseMode = !useMouseMode;

    if (useMouseMode) {
      if (joystickTouchId !== null) releaseJoystick();
      if (pcToggleBtn) {
        pcToggleBtn.textContent = "📱 Hunt by Phone";
        pcToggleBtn.style.background = "var(--gold)";
        pcToggleBtn.style.color = "#0c0c14";
        pcToggleBtn.style.borderColor = "var(--mango)";
      }
      tiltReadout.textContent = "🖱️ PC Mouse Aim Active";
      joystickHint.innerHTML = "Controlled by<br>PC Mouse 🖱️";
      joystickZone.style.opacity = "0.4";
      send({ type: "control-mode", mode: "mouse" });
    } else {
      if (pcToggleBtn) {
        pcToggleBtn.textContent = "🖥️ Hunt by PC";
        pcToggleBtn.style.background = "#1a1a2e";
        pcToggleBtn.style.color = "#eaf4ff";
        pcToggleBtn.style.borderColor = "#3a3a5c";
      }
      tiltReadout.textContent = "aim: 0.00, 0.00";
      joystickHint.innerHTML = "🕹️<br>TOUCH & DRAG<br>TO AIM";
      joystickZone.style.opacity = "1";
      send({ type: "control-mode", mode: "phone" });
    }
  }

  if (pcToggleBtn) {
    pcToggleBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      toggleControlMode();
    }, { passive: false });
    pcToggleBtn.addEventListener("click", (e) => {
      e.preventDefault();
      toggleControlMode();
    });
  }

  // ===================================================================
  // PAUSE & RESUME
  // ===================================================================
  let isPhonePaused = false;
  const pauseBtn = document.getElementById("pause-btn");

  function resetPauseState() {
    isPhonePaused = false;
    if (pauseBtn) {
      pauseBtn.textContent = "⏸️ Pause";
      pauseBtn.style.background = "#242438";
      pauseBtn.style.color = "#eaf4ff";
    }
    if (fireBtn) {
      fireBtn.disabled = false;
      fireBtn.style.opacity = "1";
    }
  }

  if (pauseBtn) {
    pauseBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      isPhonePaused = !isPhonePaused;
      if (isPhonePaused) {
        send({ type: "pause" });
        pauseBtn.textContent = "▶️ RESUME";
        pauseBtn.style.background = "var(--gold)";
        pauseBtn.style.color = "#0c0c14";
        fireBtn.disabled = true;
        fireBtn.style.opacity = "0.3";
      } else {
        send({ type: "resume" });
        pauseBtn.textContent = "⏸️ Pause";
        pauseBtn.style.background = "#242438";
        pauseBtn.style.color = "#eaf4ff";
        fireBtn.disabled = false;
        fireBtn.style.opacity = "1";
      }
    }, { passive: false });
  }

  // ===================================================================
  // FIRE (touchstart for instant multi-touch response)
  // ===================================================================
  function doFire() {
    if (isPhonePaused) return;
    send({ type: "fire" });
    const clone = shootSound.cloneNode();
    clone.volume = 0.5;
    clone.play().catch(() => {});
    if (navigator.vibrate) navigator.vibrate(35);
    // Visual press feedback
    fireBtn.style.transform = "translateY(4px)";
    fireBtn.style.boxShadow = "0 2px 0 #a3131c";
    setTimeout(() => {
      fireBtn.style.transform = "";
      fireBtn.style.boxShadow = "";
    }, 80);
  }

  fireBtn.addEventListener("touchstart", (e) => {
    e.preventDefault(); // prevent click + ghost click
    e.stopPropagation(); // don't let the joystick zone grab this touch
    doFire();
  }, { passive: false });

  // ===================================================================
  // PLAY AGAIN
  // ===================================================================
  playAgainBtn.addEventListener("click", () => {
    resetPauseState();
    send({ type: "restart" });
    mangoBadge.style.display = "none";
    miniHealthEl.textContent = "100";
    miniHealthEl.style.color = "#4ade80";
    miniAmmoEl.textContent = "5";
    miniAmmoEl.style.color = "var(--ghost)";
    miniScoreEl.textContent = "0";
    joystickTouchId = null;
    aimX = 0;
    aimY = 0;
    joystickBase.style.display = "none";
    joystickKnob.style.transition = "none";
    joystickKnob.style.transform = "translate(0px, 0px)";
    if (!useMouseMode) joystickHint.style.display = "block";
    stepGameover.classList.add("hidden");
    stepPlay.classList.add("active");
  });

  // ===================================================================
  // FORCE LANDSCAPE HINT (on portrait screens)
  // ===================================================================
  function checkOrientation() {
    if (!stepPlay.classList.contains("active") || useMouseMode) return;
    if (window.innerWidth < window.innerHeight && window.innerWidth < 500) {
      joystickHint.innerHTML = "↻<br>ROTATE PHONE<br>TO LANDSCAPE";
    } else {
      joystickHint.innerHTML = "🕹️<br>TOUCH & DRAG<br>TO AIM";
    }
  }
  window.addEventListener("resize", checkOrientation);
  window.addEventListener("orientationchange", checkOrientation);

</script>
</body>
</html>
